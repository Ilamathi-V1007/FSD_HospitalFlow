services:
  # Backend Web Service on Render
  - type: web
    name: flowalloc-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: flowalloc-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  # Managed PostgreSQL Database on Render
  - name: flowalloc-postgres
    databaseName: hospitalflow
    user: hospitalflow_user
    plan: free
    region: oregon

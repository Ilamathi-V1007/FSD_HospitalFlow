services:
  - type: web
    name: flowalloc-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: hospitalflow
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hospitalflow
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hospitalflow
          property: database
      - key: DB_USER
        fromDatabase:
          name: hospitalflow
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hospitalflow
          property: password
      - key: JWT_SECRET
        generateValue: true


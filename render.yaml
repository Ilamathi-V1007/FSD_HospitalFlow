services:
  # Backend Web Service on Render
  - type: web
    name: flowalloc-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: flowalloc-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: flowalloc-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: flowalloc-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: flowalloc-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: flowalloc-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  # Managed PostgreSQL Database on Render
  - name: flowalloc-postgres
    databaseName: hospitalflow
    user: hospitalflow_user
    plan: free
    region: oregon

server:
  port: 8080

spring:
  application:
    name: hospitalflow-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/hospitalflow
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production}
    expiration-ms: 3600000   # 1 hour

springdoc:
  swagger-ui:
    path: /swagger-ui.html

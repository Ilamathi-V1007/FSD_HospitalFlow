version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hospitalflow-db
    environment:
      POSTGRES_DB: hospitalflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    container_name: hospitalflow-backend
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev-only-secret-change-in-production
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: hospitalflow-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
